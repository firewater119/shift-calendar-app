name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          find . -maxdepth 2 -type f -iname '*.zip' -print0 | while IFS= read -r -d '' zipfile; do
            name=$(basename "$zipfile" .zip)
            mkdir -p "extracted/$name"
            unzip -q -o "$zipfile" -d "extracted/$name"
          done
          # Some bundles contain a second source ZIP. Extract those too.
          find extracted -type f -iname '*.zip' -print0 | while IFS= read -r -d '' zipfile; do
            dest="${zipfile%.zip}_contents"
            mkdir -p "$dest"
            unzip -q -o "$zipfile" -d "$dest"
          done
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Locate and build Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "${SETTINGS:-}" ]; then
            echo 'Android project not found in uploaded ZIP.'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "${APK:-}" ]; then
            echo 'APK was not created.'
            exit 1
          fi
          cp "$APK" artifact/ShiftCalendarApp-debug.apk
          sha256sum artifact/ShiftCalendarApp-debug.apk > artifact/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendarApp-debug-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30
