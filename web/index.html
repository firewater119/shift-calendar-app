<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101419"><link rel="manifest" href="manifest.webmanifest"><title>교대달력</title><style>:root{--bg:#101419;--line:#343a41;--fg:#eee;--dang:#F5C842;--ya:#9E9E9E;--bi:#FFFFFF;--ju:#FF9800}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#080b0e;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}button,input,textarea{font:inherit}.app{width:min(100%,520px);height:100dvh;margin:auto;background:var(--bg);overflow:hidden;position:relative}.page{height:calc(100dvh - 76px - env(safe-area-inset-bottom));display:none;overflow:hidden}.page.active{display:flex;flex-direction:column}.top{height:88px;display:flex;align-items:center;padding:env(safe-area-inset-top) 18px 0;gap:10px}.monthTitle{font-size:28px;font-weight:850;flex:1}.topBtn{border:0;background:none;color:#ddd;font-size:28px;padding:8px 12px}.today{font-size:18px;color:#80b2ff;font-weight:800}.week{height:44px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;text-align:center;font-size:17px;font-weight:800}.sun{color:#ff555d!important}.sat{color:#4c91ff!important}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.cell{min-width:0;min-height:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 4px;overflow:hidden}.outside{opacity:.28}.date{text-align:center;font-size:16px;font-weight:800}.shift{text-align:center;height:34px;margin-top:5px;font-size:18px;font-weight:900}.badge{display:inline-flex;width:31px;height:31px;border-radius:50%;align-items:center;justify-content:center;color:#111}.bi{color:white}.memo{height:20px;margin-top:3px;padding:1px 3px;background:#20252a;border-left:3px solid #7699aa;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header{height:76px;display:flex;align-items:end;padding:0 20px 14px;font-size:24px;font-weight:850}.statsBody{flex:1;display:flex;flex-direction:column;padding:15px 20px}.statMonth{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800}.statMonth button{border:0;background:none;color:white;font-size:26px}.circles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);align-content:center;text-align:center}.sCircle{width:60px;height:60px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;color:#111;font-size:28px;font-weight:900}.sCount{font-size:20px;font-weight:800;margin-top:9px}.settings{flex:1;overflow:auto;padding:0 16px}.sectionTitle{font-weight:800;margin:14px 2px 8px}.group{background:#151a20;border:1px solid var(--line);border-radius:11px;overflow:hidden}.row{min-height:54px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.row span:first-child{flex:1}.right{color:#aaa}.bottom{height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);position:absolute;bottom:0;left:0;right:0;background:#202228;display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:none;color:#ddd;font-size:13px;font-weight:800}.ico{display:block;font-size:25px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(430px,100%);background:#181d23;border-radius:16px;padding:18px}.field{width:100%;padding:11px;background:#101419;color:white;border:1px solid #444;border-radius:7px}.chips,.actions{display:flex;gap:8px;margin-top:14px}.chip,.btn{flex:1;padding:11px;border:0;border-radius:8px}.chip{font-weight:900}.primary{background:#2e75df;color:white}</style></head><body><main class="app"><section id="calendarPage" class="page active"><div class="top"><div id="monthTitle" class="monthTitle"></div><button class="topBtn" id="prev">‹</button><button class="topBtn today" id="today">오늘</button><button class="topBtn" id="next">›</button></div><div class="week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div><div id="grid" class="grid"></div></section><section id="statsPage" class="page"><div class="header">월별 통계</div><div class="statsBody"><div class="statMonth"><button id="sprev">‹</button><span id="statMonth"></span><button id="snext">›</button></div><div id="circles" class="circles"></div></div></section><section id="settingsPage" class="page"><div class="header">설정</div><div class="settings"><div class="sectionTitle">기본 설정</div><div class="group"><div class="row" id="patternRow"><span>근무 패턴 자동입력</span><span class="right">›</span></div><div class="row" id="colorRow"><span>근무 유형별 색상</span><span class="right">직접 설정 ›</span></div></div><div class="sectionTitle">캘린더 연동</div><div class="group"><div class="row" id="icsImport"><span>Apple 캘린더 일정 가져오기 (.ics)</span><span class="right">›</span></div><div class="row" id="icsClear"><span>가져온 일정 삭제</span></div></div></div></section><nav class="bottom"><button class="tab" data-page="calendarPage"><span class="ico">▣</span>달력</button><button class="tab" data-page="statsPage"><span class="ico">▥</span>통계</button><button class="tab" data-page="settingsPage"><span class="ico">⚙</span>설정</button></nav></main><div id="dayModal" class="modal"><div class="card"><h2 id="dayDate">근무 입력</h2><div class="chips"><button class="chip" data-shift="당">당</button><button class="chip" data-shift="야">야</button><button class="chip" data-shift="비">비</button><button class="chip" data-shift="주">주</button></div><textarea id="memo" class="field" placeholder="메모"></textarea><div class="actions"><button class="btn" id="deleteDay">삭제</button><button class="btn primary" id="saveDay">저장</button></div></div></div><div id="patternModal" class="modal"><div class="card"><h2>패턴 자동입력</h2><input id="startDate" type="date" class="field"><input id="pattern" value="당비비" class="field"><input id="days" type="number" value="90" min="1" max="730" class="field"><div class="actions"><button class="btn primary" id="applyPattern">적용</button></div></div></div><input type="file" id="icsFile" accept=".ics,text/calendar" hidden><script>const KS='sc-s',KM='sc-m',KP='sc-p',KI='sc-i';let shifts=JSON.parse(localStorage.getItem(KS)||'{}'),memos=JSON.parse(localStorage.getItem(KM)||'{}'),ics=JSON.parse(localStorage.getItem(KI)||'{}'),prefs=JSON.parse(localStorage.getItem(KP)||'{"colors":{"당":"#F5C842","야":"#9E9E9E","비":"#FFFFFF","주":"#FF9800"}}'),view=new Date(),statView=new Date(),selected,selectedShift;view.setDate(1);const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function save(){localStorage.setItem(KS,JSON.stringify(shifts));localStorage.setItem(KM,JSON.stringify(memos));localStorage.setItem(KP,JSON.stringify(prefs));localStorage.setItem(KI,JSON.stringify(ics))}function sh(s){if(!s)return'';if(s==='비')return `<span style="color:${prefs.colors[s]}">비</span>`;return `<span class="badge" style="background:${prefs.colors[s]}">${s}</span>`}function render(){let y=view.getFullYear(),m=view.getMonth();$('monthTitle').textContent=`${y}. ${pad(m+1)}`;$('grid').innerHTML='';let f=new Date(y,m,1),st=new Date(y,m,1-f.getDay());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let k=key(d),c=document.createElement('div');c.className='cell '+(d.getMonth()!==m?'outside ':'')+(d.getDay()===0?'sun ':d.getDay()===6?'sat ':'');let ex=(ics[k]||[]).map(x=>`<div class="memo">${x}</div>`).join('');c.innerHTML=`<div class="date">${d.getDate()}</div><div class="shift">${sh(shifts[k])}</div>${memos[k]?`<div class="memo">${memos[k]}</div>`:''}${ex}`;c.onclick=()=>{selected=d;selectedShift=shifts[k];$('dayDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;$('memo').value=memos[k]||'';$('dayModal').classList.add('show')};$('grid').append(c)}}document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>selectedShift=b.dataset.shift);$('saveDay').onclick=()=>{let k=key(selected);if(selectedShift)shifts[k]=selectedShift;let m=$('memo').value.trim();m?memos[k]=m:delete memos[k];save();render();$('dayModal').classList.remove('show')};$('deleteDay').onclick=()=>{let k=key(selected);delete shifts[k];delete memos[k];save();render();$('dayModal').classList.remove('show')};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date();view.setDate(1);render()};$('patternRow').onclick=()=>{$('startDate').value=key(new Date());$('patternModal').classList.add('show')};$('applyPattern').onclick=()=>{let a=$('startDate').value.split('-').map(Number),st=new Date(a[0],a[1]-1,a[2]),p=[...$('pattern').value].map(x=>x==='휴'?'비':x).filter(x=>'당비야주'.includes(x)),n=+$('days').value;for(let i=0;i<n;i++){let d=new Date(st);d.setDate(st.getDate()+i);shifts[key(d)]=p[i%p.length]}save();render();$('patternModal').classList.remove('show')};function stats(){let y=statView.getFullYear(),m=statView.getMonth(),n=new Date(y,m+1,0).getDate(),c={당:0,야:0,비:0,주:0};for(let d=1;d<=n;d++){let s=shifts[key(new Date(y,m,d))];if(s)c[s]++}$('statMonth').textContent=`${y}. ${pad(m+1)}`;$('circles').innerHTML=['당','야','비','주'].map(s=>`<div><div class="sCircle" style="background:${prefs.colors[s]}">${s}</div><div class="sCount">${c[s]}일</div></div>`).join('')}$('sprev').onclick=()=>{statView.setMonth(statView.getMonth()-1);stats()};$('snext').onclick=()=>{statView.setMonth(statView.getMonth()+1);stats()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(t.dataset.page).classList.add('active');if(t.dataset.page==='statsPage'){statView=new Date(view);stats()}});$('icsImport').onclick=()=>$('icsFile').click();$('icsFile').onchange=async e=>{let text=await e.target.files[0].text(),blocks=text.replace(/\r?\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1),count=0;for(let b of blocks){let dt=(b.match(/DTSTART[^:]*:(\d{8})/)||[])[1],su=(b.match(/SUMMARY:(.*)/)||[])[1];if(dt){let k=`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`;(ics[k]||(ics[k]=[])).push((su||'일정').trim());count++}}save();render();alert(`${count}개 일정을 가져왔습니다.`)};$('icsClear').onclick=()=>{ics={};save();render()};render();stats();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
