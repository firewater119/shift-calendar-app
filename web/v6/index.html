<button id="del" class="btn">삭제</button><button id="saveDay" class="btn primary">저장</button></div></div></div><div id="patternModal" class="modal"><div class="card"><h2>근무 패턴 자동입력</h2><input id="start" type="date" class="field"><input id="pattern" value="당비비" class="field"><input id="period" type="number" value="365" class="field"><div class="actions"><button class="btn" data-close="patternModal">취소</button><button id="apply" class="btn primary">적용</button></div></div></div><div id="colorModal" class="modal"><div class="card"><h2>근무 유형별 색상</h2><div class="row pick" data-shift="당"><span>당</span><i id="v당" class="swatch"></i></div><div class="row pick" data-shift="야"><span>야</span><i id="v야" class="swatch"></i></div><div class="row pick" data-shift="비"><span>비</span><i id="v비" class="swatch"></i></div><div class="row pick" data-shift="주"><span>주</span><i id="v주" class="swatch"></i></div><div class="actions"><button id="defaults" class="btn">기본값</button><button id="saveColors" class="btn primary">저장</button></div></div></div><div id="paletteModal" class="modal"><div class="card"><div class="pickTitle">색상 선택</div><div id="pickWho" class="pickWho"></div><div id="palette" class="palette"></div><div class="actions"><button id="cancelPalette" class="btn">취소</button><button id="setPalette" class="btn primary">설정</button></div></div></div><input id="icsFile" type="file" accept=".ics,text/calendar" hidden><input id="restoreFile" type="file" accept="application/json" hidden><script>const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),K={s:'v6-shifts',m:'v6-memos',p:'v6-prefs',i:'v6-ics'};const DEF={'당':'#F5C842','야':'#9E9E9E','비':'#FFFFFF','주':'#FF9800'},PALETTE=['#FF0000','#00FFFF','#0000FF','#00FF00','#FF00FF','#FFFF00','#000000','#FFFFFF'];let shifts=JSON.parse(localStorage.getItem(K.s)||'{}'),memos=JSON.parse(localStorage.getItem(K.m)||'{}'),prefs=JSON.parse(localStorage.getItem(K.p)||'{}'),ics=JSON.parse(localStorage.getItem(K.i)||'{}');prefs.colors={...DEF,...(prefs.colors||{})};let view=new Date(),stat=new Date(),sel=null,selShift=null,tempColors={},pickShift='',pickColor='';view.setDate(1);function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function persist(){localStorage.setItem(K.s,JSON.stringify(shifts));localStorage.setItem(K.m,JSON.stringify(memos));localStorage.setItem(K.p,JSON.stringify(prefs));localStorage.setItem(K.i,JSON.stringify(ics))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sh(s){if(!s)return'';if(s==='비')return `<span style="color:${prefs.colors[s]};font-weight:900">비</span>`;return `<span class="badge" style="background-color:${prefs.colors[s]}">${s}</span>`}function render(){let y=view.getFullYear(),m=view.getMonth();$('month').textContent=`${y}. ${pad(m+1)}`;$('grid').innerHTML='';let st=new Date(y,m,1);st.setDate(1-st.getDay());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let k=key(d),c=document.createElement('div');c.className='cell '+(d.getMonth()!=m?'outside ':'')+(d.getDay()==0?'sun ':d.getDay()==6?'sat ':'');let ex=(ics[k]||[]).map(x=>`<div class="memo">${esc(x)}</div>`).join('');c.innerHTML=`<div class="date">${d.getDate()}</div><div class="shift">${sh(shifts[k])}</div>${memos[k]?`<div class="memo">${esc(memos[k])}</div>`:''}${ex}`;c.onclick=()=>{sel=d;selShift=shifts[k]||null;$('dayTitle').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;$('memo').value=memos[k]||'';$('dayModal').classList.add('show')};$('grid').append(c)}}function stats(){let y=stat.getFullYear(),m=stat.getMonth(),last=new Date(y,m+1,0).getDate(),n={당:0,야:0,비:0,주:0};for(let d=1;d<=last;d++){let s=shifts[key(new Date(y,m,d))];if(n[s]!=null)n[s]++}$('sm').textContent=`${y}. ${pad(m+1)}`;$('circles').innerHTML=['당','야','비','주'].map(s=>`<div><div class="circle" style="background-color:${prefs.colors[s]}">${s}</div><div class="count">${n[s]}일</div></div>`).join('')}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>selShift=b.dataset.s);$('saveDay').onclick=()=>{let k=key(sel);selShift?shifts[k]=selShift:delete shifts[k];let v=$('memo').value.trim();v?memos[k]=v:delete memos[k];persist();render();$('dayModal').classList.remove('show')};$('del').onclick=()=>{let k=key(sel);delete shifts[k];delete memos[k];persist();render();$('dayModal').classList.remove('show')};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date();view.setDate(1);render()};$('sp').onclick=()=>{stat.setMonth(stat.getMonth()-1);stats()};$('sn').onclick=()=>{stat.setMonth(stat.getMonth()+1);stats()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active');if(b.dataset.p==='stats'){stat=new Date(view);stats()}});$('patternRow').onclick=()=>{$('start').value=key(new Date());$('patternModal').classList.add('show')};$('apply').onclick=()=>{let a=$('start').value.split('-').map(Number),d0=new Date(a[0],a[1]-1,a[2]),p=[...$('pattern').value].filter(x=>'당야비주'.includes(x)),n=+$('period').value;if(!p.length)return alert('당/야/비/주 패턴을 입력하세요.');for(let i=0;i<n;i++){let d=new Date(d0);d.setDate(d0.getDate()+i);shifts[key(d)]=p[i%p.length]}persist();render();$('patternModal').classList.remove('show')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));function paintSamples(){for(let s of ['당','야','비','주'])$('v'+s).style.backgroundColor=tempColors[s]}$('colorRow').onclick=()=>{tempColors={...prefs.colors};paintSamples();$('colorModal').classList.add('show')};document.querySelectorAll('.pick').forEach(r=>r.onclick=()=>{pickShift=r.dataset.shift;pickColor=tempColors[pickShift];$('pickWho').textContent=pickShift+' 색상';$('palette').innerHTML=PALETTE.map(c=>`<button class="pcolor ${c.toUpperCase()===pickColor.toUpperCase()?'on':''}" data-color="${c}"><i style="background-color:${c}"></i></button>`).join('');$('paletteModal').classList.add('show');document.querySelectorAll('.pcolor').forEach(b=>b.onclick=()=>{pickColor=b.dataset.color;document.querySelectorAll('.pcolor').forEach(x=>x.classList.toggle('on',x===b))})});$('cancelPalette').onclick=()=>$('paletteModal').classList.remove('show');$('setPalette').onclick=()=>{tempColors[pickShift]=pickColor;paintSamples();$('paletteModal').classList.remove('show')};$('saveColors').onclick=()=>{prefs.colors={...tempColors};persist();render();stats();$('colorModal').classList.remove('show')};$('defaults').onclick=()=>{tempColors={...DEF};paintSamples()};$('icsRow').onclick=()=>$('icsFile').click();$('icsFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=(await f.text()).replace(/\r?\n[ \t]/g,''),blocks=t.split('BEGIN:VEVENT').slice(1),count=0;for(let b of blocks){let dt=(b.match(/DTSTART[^:]*:(\d{8})/)||[])[1],su=(b.match(/SUMMARY:(.*)/)||[])[1];if(dt){let k=`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`;(ics[k]||(ics[k]=[])).push((su||'일정').trim());count++}}persist();render();alert(`${count}개의 일정을 가져왔습니다.`);e.target.value=''};$('icsClear').onclick=()=>{if(confirm('가져온 일정을 모두 삭제할까요?')){ics={};persist();render()}};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({shifts,memos,prefs,ics},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shiftcal-v6-backup.json';a.click();URL.revokeObjectURL(a.href)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());shifts=x.shifts||{};memos=x.memos||{};ics=x.ics||{};prefs=x.prefs||{};prefs.colors={...DEF,...(prefs.colors||{})};persist();render();stats();alert('복원했습니다.')}catch{alert('백업 파일을 확인해주세요.')}};render();stats();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></b
